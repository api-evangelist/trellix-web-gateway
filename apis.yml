aid: trellix-web-gateway
name: Trellix Web Gateway
description: >-
  Trellix Web Gateway (formerly McAfee Web Gateway) provides advanced threat protection and secure web access for
  enterprises. It offers URL filtering, malware detection, data loss prevention, SSL inspection, and cloud security
  capabilities through a comprehensive web security platform with REST APIs for appliance management, policy
  configuration, and security reporting.
accessModel:
  pricing: enterprise
  onboarding: self-serve
  trial: false
  try_now: false
